<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060a18"><link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script><title>Find providers | Service Local Finder</title></head>
<body><a class="skip" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main" class="wrap section"><h1 class="h-md">Find providers</h1>
<form id="filters" class="card filters" role="search" aria-label="Search and filters">
  <div class="span2"><label for="q">Search</label><input id="q" type="search" placeholder="Name, service or keyword"></div>
  <div><label for="cat">Category</label><select id="cat"><option value="all">All categories</option></select></div>
  <div><label for="loc">Locality</label><input id="loc" list="locality-list" placeholder="Any locality"><datalist id="locality-list"></datalist></div>
  <div><label for="rating">Minimum rating</label><select id="rating"><option value="0">Any</option><option value="4">4.0+</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option></select></div>
  <div><label for="price">Maximum price (₹)</label><input id="price" type="number" min="0" step="50" placeholder="No limit" inputmode="numeric"><p id="price-hint" class="small muted" role="status"></p></div>
  <div><label for="unit">Price type</label><select id="unit"><option value="any">Any</option><option value="visit">Per visit</option><option value="hour">Per hour (tutors)</option></select></div>
  <div><label for="sort">Sort by</label><select id="sort"><option value="rating">Highest rating</option><option value="price">Lowest price</option><option value="experience">Most experience</option><option value="nearest" id="sort-near" disabled>Nearest to me</option></select></div>
  <div class="end"><button id="clear" class="btn btn-ghost" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Clear Filters</button></div>
</form>
<div class="geo"><button id="locate" class="btn btn-primary" type="button"><i data-lucide="locate-fixed" aria-hidden="true"></i>Use my location</button><span id="geo-status" class="small muted" role="status" aria-live="polite"></span></div>
<div id="loc-chips" class="loc-chips" role="group" aria-label="Filter by area"></div>
<div id="map" class="map" role="region" aria-label="Map of matching providers"></div>
<p id="count" class="muted count" role="status" aria-live="polite"></p>
<div id="results" class="grid"></div></main>
<footer id="site-footer"></footer>
<script type="module" src="js/providers.js"></script></body></html>
